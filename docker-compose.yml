version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: ./php/Dockerfile
    volumes:
      - ./typelearn_app:/var/www
    working_dir: /var/www
    depends_on:
      - db
    ports:
      - "9010:9000"

  web:
    image: nginx:alpine
    volumes:
      - ./typelearn_app:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8083:80"
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: typelearn_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8889:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db-data: